services:
  db:
    image: pgvector/pgvector:pg16
    container_name: styla_db
    restart: always
    environment:
      POSTGRES_USER: styla_user
      POSTGRES_PASSWORD: styla_password
      POSTGRES_DB: styla_wardrobe
    ports:
      - "5440:5432"
    volumes:
      - styla_db_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U styla_user -d styla_wardrobe"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: styla_api
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "127.0.0.1:7860:7860"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Uploaded garment photos live under data/ — keep them across
      # container recreates (rebuilds, .env changes, image updates).
      - styla_data:/home/user/app/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      start_period: 180s
      retries: 3

volumes:
  styla_db_data:
  styla_data:
